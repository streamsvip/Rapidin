<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crear Cuenta | Rapidín</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style-login.css">

</head>

<body>

<div class="container">

<div class="login-box">

<img src="FBA98F21-22FD-4638-944C-C2F201AE22D4.png" class="logo">

<h1>Crear Cuenta</h1>

<p>Regístrate para comenzar a usar Rapidín.</p>

<form>

<input
type="text"
id="nombre"
placeholder="Nombre completo">

<input
type="email"
id="correo"
placeholder="Correo electrónico">

<input
type="password"
id="clave"
placeholder="Contraseña">

<input
type="password"
id="confirmar"
placeholder="Confirmar contraseña">

<button id="registroBtn">

Crear cuenta

</button>

</form>

<div class="links">

<a href="login.html">

Ya tengo una cuenta

</a>

</div>

<a href="index.html" class="volver">

← Volver al inicio

</a>

</div>

</div>

<script type="module" src="registro.js"></script>

</body>

</html>
