<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Rapidín</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style-login.css">
</head>
<body>

<div class="container">
    <div class="login-box">

        <img src="FBA98F21-22FD-4638-944C-C2F201AE22D4.png" class="logo" alt="Logo Rapidín">

        <h1>Bienvenido</h1>
        <p>Inicia sesión para continuar</p>

        <form id="loginForm">
            <input 
                type="email" 
                id="email" 
                placeholder="Correo electrónico" 
                required
            >
            <div id="error-email" class="error-msg"></div>

            <div class="pass-wrap">
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Contraseña" 
                    required
                >
                <span id="togglePass" class="eye" role="button" tabindex="0">👁</span>
            </div>
            <div id="error-password" class="error-msg"></div>

            <!-- Enlace de recuperar contraseña -->
            <div class="forgot-link">
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" id="loginBtn">Ingresar</button>
        </form>

        <div class="links">
            <a href="registro.html">Crear cuenta</a>
        </div>

        <a href="index.html" class="volver">← Volver al inicio</a>

    </div>
</div>

<script type="module" src="login.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
