<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crear Cuenta | Rapidín</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style-login.css">

</head>

<body>

<div class="container">

  <div class="login-box">

    <img src="FBA98F21-22FD-4638-944C-C2F201AE22D4.png" class="logo">

    <h1>Crear Cuenta</h1>

    <p>Regístrate para comenzar a usar Rapidín</p>

    <!-- REGISTER FORM -->
    <form id="registerForm">

      <input 
        type="text"
        id="nombre"
        placeholder="Nombre completo"
        required
      >

      <!-- TELEFONO -->
      <div class="phone-box">
        <span>+51</span>
        <input 
          type="tel"
          id="telefono"
          placeholder="Número de celular"
          maxlength="9"
          inputmode="numeric"
          required
        >
      </div>

      <input 
        type="email"
        id="email"
        placeholder="Correo electrónico"
        required
      >

      <!-- PASSWORD -->
      <div class="pass-wrap">

        <input 
          type="password"
          id="password"
          placeholder="Contraseña"
          required
        >

        <span id="togglePass" class="eye">👁</span>

      </div>

      <!-- CONFIRM PASSWORD -->
      <input 
        type="password"
        id="confirmPassword"
        placeholder="Confirmar contraseña"
        required
      >

      <button type="submit" id="registroBtn">
        Crear cuenta
      </button>

    </form>

    <div class="links">
      <a href="login.html">Ya tengo una cuenta</a>
    </div>

    <a href="index.html" class="volver">← Volver al inicio</a>

  </div>

</div>

<script type="module" src="registro.js"></script>

</body>
</html>
