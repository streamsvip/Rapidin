<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuevo Pedido | Rapidín</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="pedido.css">

</head>

<body>

<header>

<a href="panel-cliente.html" class="volver">←</a>

<h2>Nuevo Pedido</h2>

</header>

<div class="contenedor">

<label>¿Qué necesitas?</label>
<input
type="text"
placeholder="Ejemplo: Comprar una pizza, medicamentos, retirar documentos...">

<label>Descripción</label>
<textarea
placeholder="Escribe todos los detalles del pedido..."></textarea>

<!-- CAMBIO IMPORTANTE: ahora es opcional -->
<label>Lugar donde comprar o recoger <span class="opcional">(opcional)</span></label>
<input
type="text"
placeholder="Ejemplo: Plaza Vea Camaná (si aplica)">

<label>Dirección de entrega</label>
<input
type="text"
placeholder="Ejemplo: Urb. La Primavera Mz A Lote 8">

<label>Foto <span class="opcional">(opcional)</span></label>
<input type="file">

<button id="publicar">
PUBLICAR PEDIDO
</button>

</div>

<script src="pedido.js"></script>

</body>

</html>
